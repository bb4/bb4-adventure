// Native installers via jpackage (JDK 14+). Additive: does not change deploy/zip/publish.
//
// Adventure publishes one jar (bb4.jarMap key "adventure") and several apps that share it.
// Each installer selects a main class and passes the story script plus resource path as arguments,
// matching the run* tasks in build.gradle.

import org.gradle.internal.os.OperatingSystem

import java.nio.file.Files
import java.nio.file.StandardCopyOption

def jpackageOs = OperatingSystem.current()
def jpackageType = jpackageOs.windows ? 'msi' : (jpackageOs.macOsX ? 'dmg' : 'deb')
def jpackageHome = System.getProperty('java.home')
def jpackageBin = new File(jpackageHome, 'bin/jpackage' + (jpackageOs.windows ? '.exe' : ''))

// Windows CreateProcess quoting splits on embedded " in --description (e.g. "go back"),
// so jpackage then treats the trailing words as Invalid Option: [...].
def sanitizeJpackageText = { String text ->
    (text ?: '')
        .replaceAll(/<[^>]+>/, '')
        .replaceAll(/["']/, '')
        .replaceAll(/\s+/, ' ')
        .trim()
}

def iconForApp = { String appId ->
    def dir = file("packaging/icons/${appId}")
    if (jpackageOs.windows) new File(dir, 'icon.ico')
    else if (jpackageOs.macOsX) new File(dir, 'icon.icns')
    else new File(dir, 'icon.png')
}

def jpackageNameFor = { Map<String, Object> propMap ->
    (propMap.get('title') as String).replaceAll(/['"]/, '').trim()
}

def linuxPackageNameFor = { String appId ->
    "bb4-${appId.toLowerCase()}"
}

def macPackageNameFor = { Map<String, Object> propMap ->
    if (propMap.containsKey('macPackageName')) {
        def explicit = (propMap.get('macPackageName') as String).trim()
        if (explicit.length() > 16) {
            throw new GradleException("macPackageName exceeds 16 characters: '${explicit}'")
        }
        return explicit
    }
    def cleaned = (propMap.get('title') as String).replaceAll(/[^A-Za-z0-9 ]/, '').trim()
    cleaned.length() <= 16 ? cleaned : cleaned.substring(0, 16).trim()
}

def consoleApp = { Map<String, Object> propMap ->
    propMap.containsKey('console') && propMap.get('console') == true
}

// bb4-gradle 2.1 reads jarMap from the bb4 extension. Older app repos still use ext.jarMap.
def resolveJarMap = {
    if (project.extensions.extraProperties.has('jarMap')) {
        return project.extensions.extraProperties.get('jarMap') as Map<String, Object>
    }
    def bb4Ext = project.extensions.findByName('bb4')
    if (bb4Ext != null && bb4Ext.hasProperty('jarMap')) {
        def raw = bb4Ext.jarMap
        if (raw instanceof Map) {
            return raw as Map<String, Object>
        }
        if (raw != null && raw.metaClass.respondsTo(raw, 'get')) {
            def value = raw.get()
            if (value instanceof Map) {
                return value as Map<String, Object>
            }
        }
    }
    throw new GradleException('jpackage: jarMap not configured (bb4.jarMap or ext.jarMap)')
}

def jarMap = resolveJarMap()
def mainJarKey = 'adventure'
if (!jarMap.containsKey(mainJarKey)) {
    throw new GradleException("jpackage: expected jarMap entry '${mainJarKey}'")
}

// jarMap disables the default :jar task; installDist only copies dependency jars into lib/.
def jarMapJarTaskNames = jarMap.keySet().collect { String key -> "${key}Jar" }

def syncJarMapIntoInstallLib = { File installLib ->
    jarMap.keySet().each { String key ->
        def jarFile = tasks.named("${key}Jar").get().archiveFile.get().asFile
        if (!jarFile.isFile()) {
            throw new GradleException("jpackage: ${jarFile.name} not built; run ${key}Jar first")
        }
        def target = new File(installLib, jarFile.name)
        if (!target.isFile() || target.lastModified() < jarFile.lastModified()) {
            Files.copy(
                jarFile.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.named('installDist').configure {
    dependsOn jarMapJarTaskNames
}
tasks.named('startScripts').configure {
    dependsOn jarMapJarTaskNames
}

def argumentsFor = { Map<String, Object> propMap ->
    List<String> cliArgs = []
    if (propMap.containsKey('script')) {
        cliArgs.addAll(['--arguments', propMap.get('script') as String])
    }
    if (propMap.containsKey('resourcePath')) {
        cliArgs.addAll(['--arguments', propMap.get('resourcePath') as String])
    }
    cliArgs
}

def jpackageAppIds = appMap.findAll { String ignored, Object entry ->
    Map<String, Object> propMap = entry as Map<String, Object>
    !(propMap.containsKey('deploy') && propMap.get('deploy') == false)
}.keySet()

def jpackageTasks = jpackageAppIds.collect { String appId ->
    Map<String, Object> propMap = appMap.get(appId) as Map<String, Object>
    def taskName = "jpackage${appId.capitalize()}"
    tasks.register(taskName, Exec) {
        group = 'distribution'
        description = "Build a native ${jpackageType} installer for ${propMap.get('title')}"
        dependsOn 'installDist', jarMapJarTaskNames

        def destDir = layout.buildDirectory.dir("jpackage/${appId}")
        outputs.dir(destDir)
        executable = jpackageBin.absolutePath
        args '--version'

        doFirst {
            destDir.get().asFile.deleteDir()
            destDir.get().asFile.mkdirs()
            if (!jpackageBin.exists()) {
                throw new GradleException("jpackage not found at ${jpackageBin}. JDK 14+ is required.")
            }
            def icon = iconForApp(appId)
            if (!icon.exists()) {
                throw new GradleException("Missing jpackage icon for ${appId}: ${icon}")
            }
            logger.lifecycle("jpackage ${appId}: --app-version ${project.jpackageVersion} (raw project.version=${project.version})")

            def installLib = layout.buildDirectory.dir("install/${project.name}/lib").get().asFile
            syncJarMapIntoInstallLib(installLib)
            def mainJarName = tasks.named("${mainJarKey}Jar").get().archiveFile.get().asFile.name
            def mainJarFile = new File(installLib, mainJarName)
            if (!mainJarFile.isFile()) {
                throw new GradleException(
                    "jpackage ${appId}: missing ${mainJarName} in ${installLib}. " +
                        "Run installDist after all jarMap jars are built.")
            }
            def mainClassName = (propMap.get('mainClass')
                ?: 'com.barrybecker4.puzzle.adventure.ui.GraphicalAdventureApp') as String
            def displayName = jpackageNameFor(propMap)
            def cli = [
                '--input', installLib.absolutePath,
                '--dest', destDir.get().asFile.absolutePath,
                '--name', displayName,
                '--app-version', project.jpackageVersion as String,
                '--description', sanitizeJpackageText(propMap.get('description') as String),
                '--vendor', 'Barry Becker',
                '--license-file', file('LICENSE').absolutePath,
                '--icon', icon.absolutePath,
                '--main-jar', mainJarName,
                '--main-class', mainClassName,
                '--java-options', '-ea',
                '--java-options', '-Dfile.encoding=UTF-8',
                '--type', jpackageType,
                '--add-modules',
                'java.desktop,java.logging,java.xml,java.management,java.naming,java.prefs,java.datatransfer,jdk.unsupported,jdk.crypto.ec,jdk.localedata',
                '--jlink-options', '--strip-debug --no-header-files --no-man-pages --ignore-signing-information',
            ]
            cli.addAll(argumentsFor(propMap))
            if (jpackageOs.macOsX) {
                cli.addAll([
                    '--mac-package-identifier', "com.barrybecker4.puzzle.adventure.${appId}",
                    '--mac-package-name', macPackageNameFor(propMap),
                ])
            } else if (jpackageOs.windows) {
                cli.addAll(['--win-menu', '--win-shortcut', '--win-dir-chooser'])
                if (consoleApp(propMap)) {
                    cli.add('--win-console')
                }
            } else {
                cli.addAll([
                    '--linux-shortcut',
                    '--linux-package-name', linuxPackageNameFor(appId),
                    '--linux-deb-maintainer', 'barrybecker4@gmail.com',
                ])
                // A custom --icon forces a desktop file. jpackage looks up
                // <resource-dir>/<launcher name>.desktop (not template.desktop) and
                // the default template sets Terminal=false. Console stories read stdin.
                if (consoleApp(propMap)) {
                    def resourceDir = layout.buildDirectory.dir("jpackage-resources/${appId}").get().asFile
                    resourceDir.mkdirs()
                    def desktop = new File(resourceDir, "${displayName}.desktop")
                    Files.copy(
                        file('packaging/linux-console/template.desktop').toPath(),
                        desktop.toPath(),
                        StandardCopyOption.REPLACE_EXISTING)
                    cli.addAll(['--resource-dir', resourceDir.absolutePath])
                }
            }
            args = cli
        }

        // jpackage keeps human --name inside the app; rename the installer artifact so
        // release assets group as bb4-<appId>-<version>.{dmg,msi,deb}.
        doLast {
            def outDir = destDir.get().asFile
            def installers = outDir.listFiles()?.findAll { File f ->
                f.name.toLowerCase().endsWith(".${jpackageType}")
            } ?: []
            if (installers.size() != 1) {
                throw new GradleException(
                    "Expected one .${jpackageType} in ${outDir}, found: ${installers*.name}")
            }
            def artifactBase = "bb4-${appId.toLowerCase()}-${project.jpackageVersion}"
            def target = new File(outDir, "${artifactBase}.${jpackageType}")
            def source = installers[0]
            if (source.canonicalFile != target.canonicalFile) {
                if (target.exists()) target.delete()
                if (!source.renameTo(target)) {
                    Files.move(source.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }
                logger.lifecycle("Renamed installer -> ${target.name}")
            }
        }
    }
    return taskName
}

tasks.register('jpackageAllApps') {
    group = 'distribution'
    description = "Build native ${jpackageType} installers for every deployable adventure app"
    dependsOn jpackageTasks
}
